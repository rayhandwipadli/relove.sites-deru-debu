<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Surat</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            width: 100%;
            height: 100vh;

            overflow: hidden;

            font-family: 'Poppins', sans-serif;

            background: #355C7D;


            position: relative;

        }

        /* ornament */
        .love {

            position: absolute;

            top: 45px;
            right: 100px;

            width: 42px;

            opacity: .95;

            animation: fadeIn 1.5s ease;

        }

        .balloon {

            position: absolute;

            right: 90px;
            bottom: 40px;

            width: 58px;

            opacity: .95;

            animation: fadeIn 1.8s ease;

        }

        .gift {

            position: absolute;

            left: 55px;
            bottom: 45px;

            width: 60px;

            opacity: .95;

            animation: fadeIn 2s ease;

        }

        /* layout */
        .main-wrapper {

            width: 100%;
            height: 100vh;

            position: relative;

        }

        /* surat */
        .letter-box {

            position: absolute;

            top: 40px;
            left: 190px;

            z-index: 2;

            animation: fadeUp 1.2s ease;

        }

        .letter-box img {

            width: 300px;

            transform:
                rotate(-2deg);

            filter:
                drop-shadow(0 15px 25px rgba(0, 0, 0, .16));

        }

        /* foto kanan */
        .photo-strip {

            position: absolute;

            top: 28px;
            left: 560px;

            animation: slideRight 1.4s ease;

        }

        .photo-strip img {

            height: 84vh;

            transform:
                rotate(3deg);

            filter:
                drop-shadow(0 15px 25px rgba(0, 0, 0, .16));

        }

        /* back */
        .back-btn {

            position: absolute;

            left: 50%;
            bottom: 18px;

            transform: translateX(-50%);

            text-decoration: none;

            color: white;

            font-size: 15px;
            font-weight: 400;

            opacity: .9;

            transition: .3s ease;

            animation: fadeIn 2.3s ease;

        }

        .back-btn:hover {

            opacity: .6;

        }

        /* animasi */
        @keyframes fadeUp {

            from {

                opacity: 0;

                transform:
                    translateY(40px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }

        @keyframes slideRight {

            from {

                opacity: 0;

                transform:
                    translateX(50px);

            }

            to {

                opacity: 1;

                transform:
                    translateX(0);

            }

        }

        @keyframes fadeIn {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }

        }

        /* MOBILE */
        @media(max-width:768px) {

            body {

                overflow-y: auto;

            }

            .main-wrapper {

                display: flex;
                flex-direction: column;
                align-items: center;

                padding:
                    40px 20px 90px;

                height: auto;

            }

            .letter-box {

                position: relative;

                top: 0;
                left: 0;

                margin-bottom: 25px;

            }

            .letter-box img {

                width: 250px;

            }

            .photo-strip {

                position: relative;

                top: 0;
                left: 0;

            }

            .photo-strip img {

                width: 160px;
                height: auto;

                transform:
                    rotate(2deg);

            }

            .love {

                width: 35px;

                top: 15px;
                right: 15px;

            }

            .balloon {

                width: 45px;

                right: 15px;
                bottom: 15px;

            }

            .gift {

                width: 50px;

                left: 15px;
                bottom: 15px;

            }

            .back-btn {

                font-size: 14px;

            }

        }
    </style>

</head>

<body>

    <!-- ornament -->
    <img src="asset/love surat.png" class="love">

    <img src="asset/balon surat.png" class="balloon">

    <img src="asset/kado surat.png" class="gift">

    <!-- layout -->
    <div class="main-wrapper">

        <!-- surat -->
        <div class="letter-box">

            <img src="asset/surat.png">

        </div>

        <!-- foto -->
        <div class="photo-strip">

            <img src="asset/foto surat.png">

        </div>

    </div>

    <!-- back -->
    <a href="halaman3.html" class="back-btn">

        Back

    </a>

    <!-- MUSIC -->
    <audio id="bg-music" loop>

        <source src="asset/about you.mp3" type="audio/mp3">

    </audio>

    <script>

        const music = document.getElementById("bg-music");

        // ambil posisi lagu terakhir
        const savedTime = localStorage.getItem("music-time");

        // kalau ada waktu tersimpan
        if (savedTime) {

            music.currentTime = parseFloat(savedTime);

        }

        // play music
        async function playMusic() {

            try {

                await music.play();

                localStorage.setItem(
                    "music-started",
                    "true"
                );

            } catch (err) {

                console.log("Autoplay blocked");

            }

        }

        // kalau sebelumnya udah pernah play
        if (localStorage.getItem("music-started") === "true") {

            music.addEventListener("loadedmetadata", () => {

                playMusic();

            });

        }

        // pertama kali user klik
        document.addEventListener("click", () => {

            playMusic();

        }, { once: true });

        // simpan posisi lagu realtime
        setInterval(() => {

            localStorage.setItem(
                "music-time",
                music.currentTime
            );

        }, 500);

        // sebelum pindah halaman
        window.addEventListener("beforeunload", () => {

            localStorage.setItem(
                "music-time",
                music.currentTime
            );

        });

    </script>

</body>

</html>
