<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Special Gift</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {

            min-height: 100vh;

            overflow: hidden;

            font-family: 'Poppins', sans-serif;

            background:
                radial-gradient(circle at top left, rgba(255, 255, 255, .08), transparent 30%),
                radial-gradient(circle at bottom right, rgba(255, 255, 255, .08), transparent 30%),
                linear-gradient(135deg,
                    #5f8fcb,
                    #4d7eb8,
                    #3f6fa8);

            background-attachment: fixed;

            position: relative;
        }

        /* blur */
        .blur1 {
            position: absolute;
            width: 350px;
            height: 350px;
            background: #8ecbff;
            border-radius: 50%;
            filter: blur(120px);
            opacity: .15;
            top: -100px;
            left: -100px;
        }

        .blur2 {
            position: absolute;
            width: 350px;
            height: 350px;
            background: #d8eeff;
            border-radius: 50%;
            filter: blur(120px);
            opacity: .12;
            bottom: -100px;
            right: -100px;
        }

        /* section */
        .main-section {

            min-height: 100dvh;

            position: relative;
            z-index: 2;

        }

        /* title */
        .title {

            font-family: 'Great Vibes', cursive;
            font-size: 80px;
            color: white;

            margin-bottom: 70px;

            text-shadow:
                0 10px 25px rgba(0, 0, 0, .2);

            animation: fadeDown 1.3s ease;

        }

        /* wrapper */
        .gift-wrapper {

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 70px;

            flex-wrap: nowrap;

        }

        /* item */
        .gift-item {
            text-align: center;
            animation: fadeUp 1.5s ease;
        }

        .gift-item img {

            width: 220px;
            max-width: 80vw;

            transition: .4s ease;

            cursor: pointer;

            filter:
                drop-shadow(0 15px 25px rgba(0, 0, 0, .18));

        }

        .gift-item img:hover {

            transform:
                translateY(-10px) scale(1.05);

        }

        /* text bawah gambar */
        .gift-text {

            margin-top: 18px;

            color: white;

            font-size: 24px;

            font-family: 'Great Vibes', cursive;

            letter-spacing: 1px;

            text-shadow:
                0 5px 15px rgba(0, 0, 0, .18);

        }

        /* sparkle */
        .sparkle {
            position: absolute;
            color: white;
            font-size: 20px;
            opacity: .8;
            animation: sparkle 2.5s infinite ease-in-out;
        }

        .s1 {
            top: 15%;
            left: 12%;
        }

        .s2 {
            top: 20%;
            right: 14%;
            animation-delay: 1s;
        }

        .s3 {
            bottom: 18%;
            left: 18%;
            animation-delay: .5s;
        }

        .s4 {
            bottom: 15%;
            right: 16%;
            animation-delay: 1.5s;
        }

        /* animations */
        @keyframes sparkle {

            0% {
                opacity: .3;
                transform: scale(.7);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }

            100% {
                opacity: .3;
                transform: scale(.7);
            }

        }

        @keyframes fadeDown {

            from {
                opacity: 0;
                transform: translateY(-40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        @keyframes fadeUp {

            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* MOBILE */
        @media(max-width:768px) {

            body {

                overflow-y: auto;
                overflow-x: hidden;

            }

            .blur1,
            .blur2 {
                display: none;
            }

            .main-section {

                min-height: 100dvh;

                justify-content: flex-start !important;

                padding:
                    30px 0 80px;

            }

            .title {

                font-size: 54px;

                margin-bottom: 35px;

                padding: 0 15px;

            }

            .gift-wrapper {

                flex-direction: column;

                gap: 40px;

            }

            .gift-item img {

                width: 220px;

                max-width: 85vw;

            }

        }
    </style>

</head>

<body>

    <!-- blur -->
    <div class="blur1"></div>
    <div class="blur2"></div>

    <!-- sparkle -->
    <div class="sparkle s1">✦</div>
    <div class="sparkle s2">✦</div>
    <div class="sparkle s3">✦</div>
    <div class="sparkle s4">✦</div>

    <!-- content -->
    <div class="container">

        <div class="main-section d-flex flex-column justify-content-center align-items-center text-center">

            <h1 class="title">
                These are for you
            </h1>

            <div class="gift-wrapper">

                <!-- amplop -->
                <div class="gift-item">

                    <img src="asset/amplop sec3.png" class="gift-link" data-link="pesan.html">

                    <div class="gift-text">
                        Message
                    </div>

                </div>

                <!-- bunga -->
                <div class="gift-item">

                    <img src="asset/bunga.png" class="gift-link" data-link="bunga.html">

                    <div class="gift-text">
                        Flower
                    </div>

                </div>

                <!-- kue -->
                <div class="gift-item">

                    <img src="asset/kue.png" class="gift-link" data-link="kue.html">

                    <div class="gift-text">
                        Cake
                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        const gifts = document.querySelectorAll('.gift-link');

        gifts.forEach(item => {

            item.addEventListener('click', () => {

                const targetPage = item.getAttribute('data-link');

                document.body.style.transition = ".8s";
                document.body.style.opacity = "0";

                setTimeout(() => {

                    window.location.href = targetPage;

                }, 700);

            });

        });

    </script>

    <!-- MUSIC -->
    <audio id="bg-music" loop>

        <source src="asset/about you.mp3" type="audio/mp3">

    </audio>

    <script>

        const music = document.getElementById("bg-music");

        // ambil posisi lagu terakhir
        const savedTime = localStorage.getItem("music-time");

        // kalau ada waktu tersimpan
        if (savedTime) {

            music.currentTime = parseFloat(savedTime);

        }

        // play music
        async function playMusic() {

            try {

                await music.play();

                localStorage.setItem(
                    "music-started",
                    "true"
                );

            } catch (err) {

                console.log("Autoplay blocked");

            }

        }

        // kalau sebelumnya udah pernah play
        if (localStorage.getItem("music-started") === "true") {

            music.addEventListener("loadedmetadata", () => {

                playMusic();

            });

        }

        // pertama kali user klik
        document.addEventListener("click", () => {

            playMusic();

        }, { once: true });

        // simpan posisi lagu realtime
        setInterval(() => {

            localStorage.setItem(
                "music-time",
                music.currentTime
            );

        }, 500);

        // sebelum pindah halaman
        window.addEventListener("beforeunload", () => {

            localStorage.setItem(
                "music-time",
                music.currentTime
            );

        });

    </script>

</body>

</html>
