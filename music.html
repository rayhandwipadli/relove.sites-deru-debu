<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- font aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            overflow: hidden;

            background:
                linear-gradient(135deg,
                    #5B86B3,
                    #7FAED8);

            font-family: 'Poppins', sans-serif;

            position: relative;

        }

        /* main */
        .main-section {

            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            padding: 40px;

        }

        /* wrapper */
        .music-layout {

            position: relative;

            width: 900px;
            height: 500px;

            animation: fadeUp 1.2s ease;

        }

        /* vinyl */
        .vinyl {

            position: absolute;

            left: 0;
            top: 50%;

            transform:
                translateY(-50%);

            width: 420px;

            animation:
                spin 8s linear infinite;

            z-index: 1;

            filter:
                drop-shadow(0 20px 30px rgba(0, 0, 0, .2));

        }

        /* yt */
        .youtube-box {

            position: absolute;

            left: 260px;
            top: 50%;

            transform:
                translateY(-50%);

            z-index: 2;

        }

        iframe {

            width: 500px;
            height: 280px;

            border: none;

            border-radius: 16px;

            box-shadow:
                0 18px 30px rgba(0, 0, 0, .2);

        }

        /* title */
        .title {

            position: absolute;

            top: 40px;
            left: 50%;

            transform: translateX(-50%);

            color: white;

            font-size: 52px;

            font-family: 'Great Vibes', cursive;

            font-weight: 400;

            text-align: center;

            z-index: 3;

            text-shadow:
                0 5px 15px rgba(0, 0, 0, .18);

        }

        /* ornament */
        .ornament {

            position: absolute;

            opacity: .95;

        }

        .love {

            width: 42px;

            top: 35px;
            right: 50px;

        }

        .balloon {

            width: 60px;

            right: 45px;
            bottom: 40px;

        }

        .gift {

            width: 70px;

            left: 45px;
            bottom: 40px;

        }

        .music-icon {

            width: 45px;

            right: 80px;
            top: 50%;

            transform: translateY(-50%);

        }

        /* back */
        .back-btn {

            position: absolute;

            bottom: 18px;
            left: 50%;

            transform: translateX(-50%);

            text-decoration: none;

            color: white;

            font-size: 15px;
            font-weight: 400;

            opacity: .9;

            transition: .3s ease;

        }

        .back-btn:hover {

            opacity: .6;

        }

        /* animasi */
        @keyframes spin {

            from {

                transform:
                    translateY(-50%) rotate(0deg);

            }

            to {

                transform:
                    translateY(-50%) rotate(360deg);

            }

        }

        @keyframes fadeUp {

            from {

                opacity: 0;

                transform:
                    translateY(40px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }

        /* mobile */
        @media(max-width:768px) {

            body {

                overflow-y: auto;

            }

            .main-section {

                padding:
                    40px 20px 90px;

            }

            .title {

                font-size: 34px;

                top: 30px;

                width: 100%;

            }

            .music-layout {

                width: 100%;
                height: auto;

                display: flex;
                flex-direction: column;
                align-items: center;

                gap: 25px;

                margin-top: 90px;

            }

            .vinyl {

                position: relative;

                width: 240px;

                left: auto;
                top: auto;

                transform: none;

                animation:
                    spinMobile 8s linear infinite;

            }

            .youtube-box {

                position: relative;

                left: auto;
                top: auto;

                transform: none;

                width: 100%;

            }

            iframe {

                width: 100%;
                height: 220px;

            }

            .love {

                width: 35px;

                top: 15px;
                right: 15px;

            }

            .balloon {

                width: 45px;

                right: 15px;
                bottom: 15px;

            }

            .gift {

                width: 55px;

                left: 15px;
                bottom: 15px;

            }

            .music-icon {

                width: 38px;

                right: 15px;

            }

        }

        @keyframes spinMobile {

            from {

                transform:
                    rotate(0deg);

            }

            to {

                transform:
                    rotate(360deg);

            }

        }
    </style>

</head>

<body>

    <!-- title -->
    <div class="title">

        This song reminds me of you

    </div>

    <!-- ornament -->
    <img src="asset/love surat.png" class="ornament love">

    <img src="asset/balon surat.png" class="ornament balloon">

    <img src="asset/kado surat.png" class="ornament gift">

    <img src="asset/music putih.png" class="ornament music-icon">

    <!-- content -->
    <div class="main-section">

        <div class="music-layout">

            <!-- piringan -->
            <img src="asset/piringan.png" class="vinyl">

            <!-- yt -->
            <div class="youtube-box">

                <iframe src="https://www.youtube.com/embed/yoI88jG3vqM" allowfullscreen>
                </iframe>

            </div>
        </div>

    </div>

    <!-- back -->
    <a href="halaman3.html" class="back-btn">

        Back

    </a>

</body>

</html>
