<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'Poppins', sans-serif;
            position: relative;
            background: #000;
        }

        /* overlay blur */
        .overlay {
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.35);

            z-index: -1;
        }

        /* content */
        .main-section {
            min-height: 100vh;
            position: relative;
            z-index: 2;
        }

        /* title */
        .title {
            font-family: 'Great Vibes', cursive;
            font-size: 95px;
            color: white;

            text-shadow:
                0 5px 20px rgba(0, 0, 0, .25);

            animation: fadeDown 1.5s ease;
        }

        /* subtitle */
        .subtitle {
            color: white;
            font-size: 18px;
            margin-top: 10px;
            margin-bottom: 35px;

            text-shadow:
                0 3px 10px rgba(0, 0, 0, .25);

            animation: fadeUp 1.5s ease;
        }

        /* button */
        .btn-love {

            border: none;
            padding: 14px 42px;

            border-radius: 100px;

            background:
                linear-gradient(135deg,
                    #8fc9ff,
                    #6caeff);

            color: white;
            font-weight: 500;
            font-size: 17px;

            box-shadow:
                0 10px 25px rgba(80, 140, 220, .35);

            transition: .4s ease;

            animation: fadeUp 1.7s ease;
        }

        .btn-love:hover {

            transform:
                translateY(-4px) scale(1.03);

            box-shadow:
                0 15px 30px rgba(80, 140, 220, .45);

        }

        /* ornaments */
        .left-love {
            position: absolute;
            left: 40px;
            bottom: 70px;

            width: 180px;

            opacity: .95;

            animation: floatSide 4s ease-in-out infinite;
        }

        .right-balloon {
            position: absolute;
            right: 50px;
            top: 80px;

            width: 170px;

            opacity: .95;

            animation: floatSide 4s ease-in-out infinite;
        }

        /* sparkle */
        .sparkle {
            position: absolute;
            color: white;
            font-size: 22px;
            opacity: .8;
            animation: sparkle 2.5s infinite ease-in-out;
            z-index: 2;
        }

        .s1 {
            top: 15%;
            left: 18%;
        }

        .s2 {
            top: 22%;
            right: 22%;
            animation-delay: 1s;
        }

        .s3 {
            bottom: 18%;
            left: 22%;
            animation-delay: .5s;
        }

        .s4 {
            bottom: 15%;
            right: 18%;
            animation-delay: 1.5s;
        }

        #bg-video {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: -2;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 30px;

            padding: 50px 60px;

            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.35);

            max-width: 950px;
            width: 90%;

            animation: fadeUp 1.5s ease;
        }

        .title {
            font-family: 'Great Vibes', cursive;
            font-size: 95px;
            color: white;
            line-height: 1.1;

            text-shadow:
                0 4px 20px rgba(0, 0, 0, .5);
        }

        .subtitle {
            color: rgba(255, 255, 255, .95);
            font-size: 18px;
            margin-top: 15px;
            margin-bottom: 35px;
        }

        .overlay {
            position: fixed;
            inset: 0;

            background:
                linear-gradient(rgba(0, 0, 0, .45),
                    rgba(0, 0, 0, .45));

            z-index: -1;
        }

        /* animations */
        @keyframes floatSide {

            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-8px);
            }

            100% {
                transform: translateY(0px);
            }

        }

        @keyframes sparkle {

            0% {
                opacity: .3;
                transform: scale(.7);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }

            100% {
                opacity: .3;
                transform: scale(.7);
            }

        }

        @keyframes fadeDown {

            from {
                opacity: 0;
                transform: translateY(-40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        @keyframes fadeUp {

            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* mobile */
        @media(max-width:768px) {

            .title {
                font-size: 58px;
                padding: 0 20px;
            }

            .subtitle {
                font-size: 15px;
                padding: 0 25px;
            }

            .btn-love {
                padding: 12px 35px;
                font-size: 15px;
            }

            .left-love {
                width: 110px;
                left: -10px;
                bottom: 90px;
                opacity: .7;
            }

            .right-balloon {
                width: 95px;
                right: 5px;
                top: 90px;
                opacity: .8;
            }

            .glass-card {
                padding: 35px 25px;
            }

            .title {
                font-size: 58px;
            }

            .subtitle {
                font-size: 15px;
            }

        }
    </style>

</head>

<body>
    <video autoplay muted loop playsinline id="bg-video">
        <source src="asset/bg vidio.mp4" type="video/mp4">
    </video>

    <!-- overlay -->
    <div class="overlay"></div>

    <!-- sparkle -->
    <div class="sparkle s1">✦</div>
    <div class="sparkle s2">✦</div>
    <div class="sparkle s3">✦</div>
    <div class="sparkle s4">✦</div>

    <!-- ornaments -->
    <img src="asset/pita love.png" class="left-love">
    <img src="asset/balon love.png" class="right-balloon">

    <!-- content -->
    <div class="container">

        <div class="main-section d-flex justify-content-center align-items-center">

            <div class="glass-card text-center">

                <h1 class="title">
                    Happy Birthday Sayang
                </h1>

                <p class="subtitle">
                    11 Juli 2026
                    Dear Deru debu ku❤️
                </p>

                <button class="btn-love" id="nextBtn">
                    Click Here
                </button>

            </div>

        </div>

    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        const btn = document.getElementById('nextBtn');

        btn.addEventListener('click', () => {

            document.body.style.transition = "1s";
            document.body.style.opacity = "0";

            setTimeout(() => {

                // halaman selanjutnya
                window.location.href = "halaman3.html";

            }, 900);

        });

    </script>

    <!-- MUSIC -->
    <audio id="bg-music" loop>

        <source src="asset/about you.mp3" type="audio/mp3">

    </audio>

    <script>

        const music = document.getElementById("bg-music");

        // ambil posisi lagu terakhir
        const savedTime = localStorage.getItem("music-time");

        // kalau ada waktu tersimpan
        if (savedTime) {

            music.currentTime = parseFloat(savedTime);

        }

        // play music
        async function playMusic() {

            try {

                await music.play();

                localStorage.setItem(
                    "music-started",
                    "true"
                );

            } catch (err) {

                console.log("Autoplay blocked");

            }

        }

        // kalau sebelumnya udah pernah play
        if (localStorage.getItem("music-started") === "true") {

            music.addEventListener("loadedmetadata", () => {

                playMusic();

            });

        }

        // pertama kali user klik
        document.addEventListener("click", () => {

            playMusic();

        }, { once: true });

        // simpan posisi lagu realtime
        setInterval(() => {

            localStorage.setItem(
                "music-time",
                music.currentTime
            );

        }, 500);

        // sebelum pindah halaman
        window.addEventListener("beforeunload", () => {

            localStorage.setItem(
                "music-time",
                music.currentTime
            );

        });

    </script>

</body>

</html>
