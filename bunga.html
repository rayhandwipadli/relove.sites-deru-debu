    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            overflow: hidden;

            background: #355C7D;

            font-family: 'Poppins', sans-serif;

        .main-section {

        }

        /* bunga */
        .flower-center {

            position: relative;

            z-index: 2;

            animation: fadeUp 1.2s ease;

        }

        .flower-center img {

            filter:

        }

        .flower-text {

            text-align: center;

            color: white;

            margin-top: 12px;

            font-size: 22px;
            font-weight: 500;

        }

        /* quote */
        .quote {

            position: absolute;

            background: white;

            padding:
                12px 16px;

            border-radius: 14px;

            font-size: 14px;
            font-weight: 500;

            color: #355C7D;

            max-width: 230px;

            box-shadow:
                0 10px 25px rgba(0, 0, 0, .12);

            animation: fadeIn 1.5s ease;

        }

        /* kiri */
        .quote1 {

            top: 120px;
            left: 120px;

        }

        .quote2 {

            top: 300px;
            left: 80px;

        }

        .quote3 {

            bottom: 120px;
            left: 120px;

        }

        /* kanan */
        .quote4 {

            top: 120px;
            right: 120px;

        }

        .quote5 {

            top: 300px;
            right: 80px;

        }

        .quote6 {

            bottom: 120px;
            right: 120px;

        }

        /* back */
        .back-btn {

            position: fixed;

            bottom: 20px;
            left: 50%;

            transform: translateX(-50%);

            text-decoration: none;

            color: white;

            font-size: 15px;
            font-weight: 400;

            opacity: .9;

            transition: .3s ease;

            z-index: 99;

        }

        .back-btn:hover {

            opacity: .6;

        }

        /* animasi */
        @keyframes fadeUp {

            from {

                opacity: 0;

                transform:
                    translateY(50px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }

        @keyframes fadeIn {

            from {

                opacity: 0;

                transform:
                    translateY(20px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }

        /* MOBILE */
        @media(max-width:768px) {

            body {

                overflow-y: auto;

            }

            .main-section {

                flex-direction: column;

                gap: 18px;

                padding:
                    40px 20px 90px;

            }

            .flower-center {

                order: -1;

                margin-bottom: 10px;

            }

            .flower-center img {

                width: 180px;

            }

            .flower-text {

                font-size: 18px;

            }

            .quote {

                position: relative;

                top: auto;
                left: auto;
                right: auto;
                bottom: auto;

                width: 100%;
                max-width: 100%;

                text-align: center;

                margin-bottom: 10px;

                font-size: 13px;

            }

            .back-btn {

                bottom: 12px;

                font-size: 14px;

            }

        }
    </style>

</head>

    <!-- music -->
    <audio id="bg-music" loop>

        <source src="asset/about you.mp3" type="audio/mp3">

    </audio>

    <!-- MUSIC -->
    <audio id="bg-music" loop>

        <source src="asset/about you.mp3" type="audio/mp3">

    </audio>

    <script>

        const music = document.getElementById("bg-music");

        // ambil posisi lagu terakhir
        const savedTime = localStorage.getItem("music-time");

        // kalau ada waktu tersimpan
        if (savedTime) {

            music.currentTime = parseFloat(savedTime);

        }

        // play music
        async function playMusic() {

            try {

                await music.play();

                localStorage.setItem(
                    "music-started",
                    "true"
                );

            } catch (err) {

                console.log("Autoplay blocked");

            }

        }

        // kalau sebelumnya udah pernah play
        if (localStorage.getItem("music-started") === "true") {

            music.addEventListener("loadedmetadata", () => {

                playMusic();

            });

        }

        // pertama kali user klik
        document.addEventListener("click", () => {

            playMusic();

        }, { once: true });

        // simpan posisi lagu realtime
        setInterval(() => {

            localStorage.setItem(
                "music-time",
                music.currentTime
            );

        }, 500);

        // sebelum pindah halaman
        window.addEventListener("beforeunload", () => {

            localStorage.setItem(
                "music-time",
                music.currentTime
            );

        });

    </script>


</body>

</html>
