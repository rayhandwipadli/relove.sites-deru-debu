<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cake</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            overflow: hidden;

            background:
                linear-gradient(135deg,
                    #5B86B3,
                    #7FAED8);

            font-family: 'Poppins', sans-serif;

            position: relative;

        }

        /* main */
        .main-section {

            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px;

            position: relative;

        }

        /* foto */
        .cake-photo {

            animation: fadeUp 1.2s ease;

        }

        .cake-photo img {

            width: 750px;
            max-width: 90vw;

            border-radius: 18px;

            filter:
                drop-shadow(0 18px 30px rgba(0, 0, 0, .18));

            transition: .3s ease;

            cursor: pointer;

        }

        .cake-photo img:hover {

            transform:
                scale(1.02);

        }

        /* ornaments */
        .ornament {

            position: absolute;

            opacity: .9;

            animation: float 3s ease-in-out infinite;

        }

        .love {

            width: 55px;

            top: 40px;
            right: 60px;

        }

        .balloon {

            width: 70px;

            bottom: 40px;
            right: 70px;

        }

        .gift {

            width: 75px;

            bottom: 40px;
            left: 60px;

        }

        .cake {

            width: 70px;

            top: 50px;
            left: 60px;

        }

        /* text */
        .click-text {

            position: absolute;

            bottom: 20px;
            left: 50%;

            transform: translateX(-50%);

            color: white;

            font-size: 15px;
            font-weight: 400;

            opacity: .9;

            animation: fadeIn 2s ease;

        }

        /* animasi */
        @keyframes fadeUp {

            from {

                opacity: 0;

                transform:
                    translateY(40px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }

        @keyframes fadeIn {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }

        }

        @keyframes float {

            0% {

                transform:
                    translateY(0);

            }

            50% {

                transform:
                    translateY(-8px);

            }

            100% {

                transform:
                    translateY(0);

            }

        }

        /* mobile */
        @media(max-width:768px) {

            body {

                overflow-y: auto;

            }

            .main-section {

                padding:
                    40px 20px 80px;

            }

            .cake-photo {

                width: 100%;

                display: flex;
                justify-content: center;

            }

            .cake-photo img {

                width: 400px;

                max-width: none;

            }

            .love {

                width: 40px;

                top: 20px;
                right: 20px;

            }

            .balloon {

                width: 50px;

                right: 20px;
                bottom: 20px;

            }

            .gift {

                width: 55px;

                left: 20px;
                bottom: 20px;

            }

            .cake {

                width: 50px;

                top: 20px;
                left: 20px;

            }

        }
    </style>

</head>

<body>

    <!-- ornaments -->
    <img src="asset/love surat.png" class="ornament love">

    <img src="asset/balon surat.png" class="ornament balloon">

    <img src="asset/kado surat.png" class="ornament gift">

    <img src="asset/kue.png" class="ornament cake">

    <!-- content -->
    <div class="main-section">

        <a href="music.html" class="cake-photo">

            <img src="asset/foto kue.png">

        </a>

    </div>

    <!-- MUSIC -->
    <audio id="bg-music" loop>

        <source src="asset/about you.mp3" type="audio/mp3">

    </audio>

    <script>

        const music = document.getElementById("bg-music");

        // ambil posisi lagu terakhir
        const savedTime = localStorage.getItem("music-time");

        // kalau ada waktu tersimpan
        if (savedTime) {

            music.currentTime = parseFloat(savedTime);

        }

        // play music
        async function playMusic() {

            try {

                await music.play();

                localStorage.setItem(
                    "music-started",
                    "true"
                );

            } catch (err) {

                console.log("Autoplay blocked");

            }

        }

        // kalau sebelumnya udah pernah play
        if (localStorage.getItem("music-started") === "true") {

            music.addEventListener("loadedmetadata", () => {

                playMusic();

            });

        }

        // pertama kali user klik
        document.addEventListener("click", () => {

            playMusic();

        }, { once: true });

        // simpan posisi lagu realtime
        setInterval(() => {

            localStorage.setItem(
                "music-time",
                music.currentTime
            );

        }, 500);

        // sebelum pindah halaman
        window.addEventListener("beforeunload", () => {

            localStorage.setItem(
                "music-time",
                music.currentTime
            );

        });

    </script>

</body>

</html>
