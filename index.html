<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReLove</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;

            font-family: 'Poppins', sans-serif;

            background:
                radial-gradient(circle at top left, rgba(255, 255, 255, .8), transparent 35%),
                radial-gradient(circle at bottom right, rgba(255, 255, 255, .7), transparent 30%),
                linear-gradient(135deg, #dff1ff, #cde8ff, #d9efff);

            background-attachment: fixed;

            position: relative;
        }

        /* glowing blur */
        .blur1 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: #8ecbff;
            border-radius: 50%;
            filter: blur(130px);
            opacity: .25;
            top: -150px;
            left: -150px;
        }

        .blur2 {
            position: absolute;
            width: 350px;
            height: 350px;
            background: #6eaef5;
            border-radius: 50%;
            filter: blur(130px);
            opacity: .18;
            bottom: -150px;
            right: -150px;
        }

        .main-section {
            min-height: 100vh;
            position: relative;
            z-index: 2;
        }

        /* title */
        .title {
            font-family: 'Great Vibes', cursive;
            font-size: 110px;
            color: #4470a8;
            margin-bottom: 10px;
            line-height: 1.1;
            text-shadow: 0 10px 25px rgba(70, 110, 170, .18);
        }

        /* envelope */
        .envelope {
            width: 520px;
            max-width: 92vw;
            cursor: pointer;

            filter:
                drop-shadow(0 30px 35px rgba(70, 110, 170, .18));

            transition: .5s ease;

            animation: floating 4s ease-in-out infinite;
        }

        .envelope:hover {
            transform: scale(1.05);
        }

        @keyframes floating {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-12px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        /* click text */
        .click-text {
            margin-top: 20px;
            color: #4c6e92;
            font-size: 20px;
            letter-spacing: 1px;
            font-weight: 500;
        }

        /* ornaments */
        .left-love {
            position: absolute;
            left: 40px;
            bottom: 70px;
            width: 180px;
            opacity: .95;
            animation: floatSide 4s ease-in-out infinite;
        }

        .right-balloon {
            position: absolute;
            right: 60px;
            top: 90px;
            width: 170px;
            opacity: .95;
            animation: floatSide 4s ease-in-out infinite;
        }

        @keyframes floatSide {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-8px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        /* sparkle */
        .sparkle {
            position: absolute;
            color: white;
            font-size: 22px;
            opacity: .8;
            animation: sparkle 2.5s infinite ease-in-out;
        }

        .s1 {
            top: 12%;
            left: 18%;
        }

        .s2 {
            top: 20%;
            right: 25%;
            animation-delay: 1s;
        }

        .s3 {
            bottom: 20%;
            left: 22%;
            animation-delay: .5s;
        }

        .s4 {
            bottom: 18%;
            right: 18%;
            animation-delay: 1.5s;
        }

        @keyframes sparkle {
            0% {
                opacity: .3;
                transform: scale(.7);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }

            100% {
                opacity: .3;
                transform: scale(.7);
            }
        }

        /* MOBILE */
        @media(max-width:768px) {



            .title {
                font-size: 58px;
                margin-bottom: 25px;
            }

            .envelope {
                width: 320px;
            }

            .click-text {
                font-size: 16px;
                margin-top: 15px;
            }

            .left-love {
                width: 110px;
                left: -10px;
                bottom: 90px;
                opacity: .7;
            }

            .right-balloon {
                width: 100px;
                right: 5px;
                top: 90px;
                opacity: .8;
            }

            .sparkle {
                font-size: 16px;
            }

        }
    </style>
</head>

<body>

    <!-- blur -->
    <div class="blur1"></div>
    <div class="blur2"></div>

    <!-- sparkle -->
    <div class="sparkle s1">✦</div>
    <div class="sparkle s2">✦</div>
    <div class="sparkle s3">✦</div>
    <div class="sparkle s4">✦</div>

    <!-- ornaments -->
    <img src="asset/pita love.png" class="left-love">
    <img src="asset/balon love.png" class="right-balloon">

    <!-- content -->
    <div class="container">

        <div class="main-section d-flex flex-column justify-content-center align-items-center text-center">

            <h1 class="title">
                Happy Birthday
            </h1>

            <img src="asset/amplop.png" class="envelope" id="openEnvelope">

            <div class="click-text">
                Click Amplop
            </div>

        </div>

    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        const envelope = document.getElementById('openEnvelope');

        envelope.addEventListener('click', () => {

            envelope.style.transform = "scale(1.15)";
            envelope.style.opacity = "0";

            document.body.style.transition = "1s";
            document.body.style.opacity = "0";

            setTimeout(() => {

                // halaman selanjutnya
                window.location.href = "halaman2.html";

            }, 900);

        });

    </script>

    <!-- music -->
    <audio id="bg-music" loop>

        <source src="asset/about you.mp3" type="audio/mp3">

    </audio>
    <script>

        // music
        const music = document.getElementById("bg-music");

        // ambil waktu terakhir
        let savedTime = localStorage.getItem("music-time");

        if (savedTime) {

            music.currentTime = savedTime;

        }

        // play pas user klik halaman
        document.body.addEventListener("click", () => {

            music.play();

        }, { once: true });

        // save waktu lagu
        setInterval(() => {

            localStorage.setItem(
                "music-time",
                music.currentTime
            );

        }, 1000);

    </script>

    <!-- MUSIC -->
    <audio id="bg-music" loop>

        <source src="asset/about you.mp3" type="audio/mp3">

    </audio>

    <script>

        const music = document.getElementById("bg-music");

        // ambil posisi lagu terakhir
        const savedTime = localStorage.getItem("music-time");

        // kalau ada waktu tersimpan
        if (savedTime) {

            music.currentTime = parseFloat(savedTime);

        }

        // play music
        async function playMusic() {

            try {

                await music.play();

                localStorage.setItem(
                    "music-started",
                    "true"
                );

            } catch (err) {

                console.log("Autoplay blocked");

            }

        }

        // kalau sebelumnya udah pernah play
        if (localStorage.getItem("music-started") === "true") {

            music.addEventListener("loadedmetadata", () => {

                playMusic();

            });

        }

        // pertama kali user klik
        document.addEventListener("click", () => {

            playMusic();

        }, { once: true });

        // simpan posisi lagu realtime
        setInterval(() => {

            localStorage.setItem(
                "music-time",
                music.currentTime
            );

        }, 500);

        // sebelum pindah halaman
        window.addEventListener("beforeunload", () => {

            localStorage.setItem(
                "music-time",
                music.currentTime
            );

        });

    </script>

</body>

</html>
