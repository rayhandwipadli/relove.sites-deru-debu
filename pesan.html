<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Message</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {

            min-height: 100vh;

            overflow-x: hidden;

            font-family: 'Poppins', sans-serif;

            background:
                linear-gradient(rgba(15, 25, 45, .72),
                    rgba(15, 25, 45, .72)),
                url('asset/msg (1).jpeg');

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            position: relative;

        }

        /* sparkle */
        .sparkle {
            position: absolute;
            color: white;
            font-size: 20px;
            opacity: .8;
            animation: sparkle 2.5s infinite ease-in-out;
            z-index: 2;
        }

        .s1 {
            top: 12%;
            left: 10%;
        }

        .s2 {
            top: 18%;
            right: 12%;
            animation-delay: 1s;
        }

        .s3 {
            bottom: 15%;
            left: 15%;
            animation-delay: .5s;
        }

        .s4 {
            bottom: 10%;
            right: 18%;
            animation-delay: 1.5s;
        }

        @keyframes sparkle {

            0% {
                opacity: .3;
                transform: scale(.7);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }

            100% {
                opacity: .3;
                transform: scale(.7);
            }

        }

        /* main */
        .main-section {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
            z-index: 2;

            padding: 60px 0;

        }

        /* surat */
        .message-side {

            position: fixed;

            left: 60px;
            bottom: 20px;

            z-index: 10;

            display: flex;
            flex-direction: column;
            align-items: center;

            animation: fadeUp 1.2s ease;

        }

        .message-img {

            width: 430px;

            filter:
                drop-shadow(0 20px 30px rgba(0, 0, 0, .25));

        }

        .back-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 50px;
            position: relative;
            z-index: 10;
        }

        .btn-back {
            padding: 12px 35px;
            text-decoration: none;
            color: white;
            font-size: 15px;
            font-weight: 500;

            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, .25);

            transition: .3s ease;
        }

        .btn-back:hover {
            transform: translateY(-4px);
            color: white;

            background: rgba(255, 255, 255, 0.15);

            box-shadow: 0 12px 30px rgba(0, 0, 0, .35);
        }

        .letter-box {
            width: 420px;
            max-height: 500px;
            overflow-y: auto;

            padding: 25px;

            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.2);

            border-radius: 20px;

            color: white;

            line-height: 1.9;
            font-size: 15px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, .2);
        }

        .cursor {
            animation: blink .8s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        @media(max-width:768px) {

            .letter-box {
                width: 100%;
                max-width: 350px;
            }

        }

        /* animasi masuk */
        @keyframes fadeUp {

            from {

                opacity: 0;

                transform:
                    translateY(60px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }

        /* text button */
        .view-text {

            margin-top: 5px;

            color: white;

            font-size: 17px;

            font-weight: 500;

            cursor: pointer;

            transition: .3s ease;

            text-shadow:
                0 5px 15px rgba(0, 0, 0, .2);

        }

        .view-text:hover {

            transform: translateY(-3px);

            opacity: .8;

        }

        /* photo */
        .photo-wrapper {

            margin-left: 420px;

            display: grid;

            grid-template-columns: repeat(2, 240px);

            gap: 30px;

            align-items: start;

            margin-top: 30px;

            animation: fadeUp 1.3s ease;

        }

        .photo {

            background: white;

            padding:
                12px 12px 55px;

            border-radius: 6px;

            box-shadow:
                0 15px 30px rgba(0, 0, 0, .22);

            transition: .4s ease;

            position: relative;

        }

        .photo:nth-child(1) {
            transform: rotate(-6deg);
        }

        .photo:nth-child(2) {
            transform: rotate(5deg);
        }

        .photo:nth-child(3) {

            transform: rotate(-4deg);

            margin-top: -60px;

        }

        .photo img {

            width: 100%;
            display: block;

        }

        .photo:hover {

            transform:
                scale(1.04) rotate(0deg);

        }

        /* mobile */
        @media(max-width:768px) {

            .main-section {

                padding:
                    40px 20px 120px;

                display: flex;
                flex-direction: column;

            }

            .message-side {

                position: relative;

                left: 0;
                bottom: 0;

                display: flex;
                justify-content: center;

                margin-bottom: 40px;

            }

            .message-img {

                width: 100%;
                max-width: 320px;

            }

            .view-text {

                font-size: 15px;

            }

            .photo-wrapper {

                margin-left: 0;

                grid-template-columns: 1fr;

                gap: 25px;

                width: 100%;

                margin-top: 0;

            }

            .photo:nth-child(3) {

                margin-top: 0;

            }

        }
    </style>

</head>

<body>

    <!-- sparkle -->
    <div class="sparkle s1">✦</div>
    <div class="sparkle s2">✦</div>
    <div class="sparkle s3">✦</div>
    <div class="sparkle s4">✦</div>

    <!-- content -->
    <div class="container-fluid">

        <div class="main-section">

            <!-- surat -->
            <div class="message-side">

                <div class="letter-box">
                    <div id="typing-text"></div>
                    <span class="cursor">|</span>
                </div>

            </div>

            <!-- photos -->
            <div class="photo-wrapper">

                <div class="photo">
                    <img src="asset/msg (1).jpeg">
                </div>

                <div class="photo">
                    <img src="asset/msg (2).jpeg">
                </div>

                <div class="photo">
                    <img src="asset/msg (3).jpeg">
                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        const text = `Assalamualaikum calon imam ku 🙏
Happy birthday, selamat ulang tahun sayang, semoga panjang umur, sehat selalu, dilancarkan rezekinya dan makin sukses aamiin🤲
Sayang, aku gak nyangka aku bakalan se cinta ini sama sayang, sayang berhasil membuat aku setiap hari makin sayang dan makin cinta sama sayang, aku selalu mendokan sayang dan mendokan kita.
Semoga dengan bertambah nya usia sayang bertambah juga keberkahan yang Allah kasih ke sayang, semoga apa yang sayang inginkan segera terwujud, dan semangat trus sayang jangan pernah putus asa mengejar impian, jangan lupa selalu bersyukur ya sayang, makasih sudah sayang sama aku, semua doa ku yg terbaik untuk sayang.
Selamat ulang tahun gantengku
Selamat ulang tahun Igo Deru Debu
I love you more sayang 
Semoga sayang selalu bahagia❤️`;

        const target = document.getElementById("typing-text");

        let i = 0;

        function typeWriter() {

            if (i < text.length) {

                if (text.charAt(i) === "\n") {
                    target.innerHTML += "<br><br>";
                } else {
                    target.innerHTML += text.charAt(i);
                }

                i++;

                setTimeout(typeWriter, 25);

            }

        }

        typeWriter();

    </script>

    <!-- MUSIC -->
    <audio id="bg-music" loop>

        <source src="asset/about you.mp3" type="audio/mp3">

    </audio>

    <script>

        const music = document.getElementById("bg-music");

        // ambil posisi lagu terakhir
        const savedTime = localStorage.getItem("music-time");

        // kalau ada waktu tersimpan
        if (savedTime) {

            music.currentTime = parseFloat(savedTime);

        }

        // play music
        async function playMusic() {

            try {

                await music.play();

                localStorage.setItem(
                    "music-started",
                    "true"
                );

            } catch (err) {

                console.log("Autoplay blocked");

            }

        }

        // kalau sebelumnya udah pernah play
        if (localStorage.getItem("music-started") === "true") {

            music.addEventListener("loadedmetadata", () => {

                playMusic();

            });

        }

        // pertama kali user klik
        document.addEventListener("click", () => {

            playMusic();

        }, { once: true });

        // simpan posisi lagu realtime
        setInterval(() => {

            localStorage.setItem(
                "music-time",
                music.currentTime
            );

        }, 500);

        // sebelum pindah halaman
        window.addEventListener("beforeunload", () => {

            localStorage.setItem(
                "music-time",
                music.currentTime
            );

        });

    </script>

    <!-- tombol kembali -->
    <div class="back-wrapper">
        <a href="index.html" class="btn-back">
            ← Kembali
        </a>
    </div>

</body>

</html>
